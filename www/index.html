<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 用量监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0f17'/><rect x='18' y='52' width='14' height='30' rx='3' fill='%233987e5'/><rect x='43' y='30' width='14' height='52' rx='3' fill='%233987e5'/><rect x='68' y='18' width='14' height='64' rx='3' fill='%233987e5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f17; --panel: #121826; --panel-2: #182033; --border: rgba(148,163,184,0.13); --border-2: rgba(148,163,184,0.22);
  --ink: #e6edf7; --ink-2: #9aa7bd; --muted: #64728a; --grid: #1c2536; --axis: #2a3547;
  --accent: #3987e5; --accent-soft: rgba(57,135,229,0.14);
  --good: #22a55b; --bad: #e66767; --good-soft: rgba(34,165,91,0.14); --bad-soft: rgba(230,103,103,0.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --other: #4b5568;
  --seq-1:#14304f; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
  --tip-bg: #e6edf7; --tip-ink: #0b0f17;
}
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5f9; --panel: #ffffff; --panel-2: #f6f8fb; --border: rgba(15,23,42,0.09); --border-2: rgba(15,23,42,0.16);
  --ink: #0f172a; --ink-2: #475569; --muted: #7c8799; --grid: #e7ebf2; --axis: #cfd6e1;
  --accent: #2a78d6; --accent-soft: rgba(42,120,214,0.10);
  --good: #0f8a43; --bad: #c93b3b; --good-soft: rgba(15,138,67,0.10); --bad-soft: rgba(201,59,59,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --other: #b6bdc9;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --tip-bg: #0f172a; --tip-ink: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 Inter, system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif; -webkit-font-smoothing: antialiased; }
.mono, .num, .kpi .value, td.num, th.num, .axis { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1520px; margin: 0 auto; padding: 16px 16px 40px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 6px 2px 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #6fb0ff); display: grid; place-items: center; }
.logo svg { width: 16px; height: 16px; }
.brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
.brand .meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.dot.stale { background: var(--s4); box-shadow: 0 0 0 3px rgba(201,133,0,.18); }
.dot.err { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.chips { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.chips button { border: 0; background: transparent; color: var(--ink-2); padding: 4px 11px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--border); background: var(--panel); color: var(--ink-2); padding: 5px 9px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; }
.btn:hover, .chips button:hover { color: var(--ink); border-color: var(--border-2); }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; margin-bottom: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 10px; position: relative; overflow: hidden; min-height: 96px; }
.kpi .label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.kpi .value { font-size: 22px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; line-height: 1.15; }
.kpi .value small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.kpi .sub { color: var(--ink-2); font-size: 11.5px; font-family: "JetBrains Mono", monospace; margin-top: 3px; letter-spacing: -0.02em; }
.kpi .foot { color: var(--muted); font-size: 11px; margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 600; font-family: "JetBrains Mono", monospace; }
.pill.up { color: var(--bad); background: var(--bad-soft); }
.pill.down { color: var(--good); background: var(--good-soft); }
.pill.flat { color: var(--ink-2); background: var(--panel-2); }
.kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.kpi svg.spark { width: 84px; height: 28px; flex: 0 0 auto; margin-bottom: 4px; opacity: 0.9; }

/* grid + panels */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 10px; min-width: 0; grid-column: span 12; }
.c8 { grid-column: span 8; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; }
@media (max-width: 1100px) { .c8, .c4 { grid-column: span 12; } }
@media (max-width: 860px) { .c6 { grid-column: span 12; } }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.ph h2 { font-size: 12.5px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
.ph .hint { color: var(--muted); font-size: 11px; }
.plot { position: relative; height: 270px; }
.plot.tall { height: 330px; } .plot.mid { height: 220px; } .plot.mini { height: 118px; }
.sub-h { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin: 4px 0 2px; }

/* tables */
.tw { overflow: auto; max-height: 480px; margin: 0 -6px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; position: sticky; top: 0; background: var(--panel); z-index: 1; }
td.num, th.num { text-align: right; }
td.dim { color: var(--muted); }
tbody tr:hover td { background: var(--panel-2); }
td.name { max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
tfoot th { color: var(--ink-2); text-transform: none; letter-spacing: 0; font-size: 12px; border-top: 1px solid var(--border-2); position: static; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: 0; }
.share { display: inline-flex; align-items: center; gap: 8px; }
.share .track { width: 90px; height: 5px; background: var(--grid); border-radius: 3px; overflow: hidden; display: inline-block; }
.share .fill { height: 100%; border-radius: 3px; display: block; }
.rank { color: var(--muted); font-size: 11px; width: 26px; }
svg.tspark { width: 96px; height: 20px; vertical-align: middle; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--ink-2); font-size: 11px; border: 1px solid var(--border); }

/* heat */
.heatwrap { overflow-x: auto; }
.heat { min-width: 560px; display: grid; grid-template-columns: 30px repeat(24, 1fr); gap: 3px; font-size: 10.5px; color: var(--muted); }
.heat .lab { display: flex; align-items: center; }
.heat .hh { text-align: center; }
.heat .cell { aspect-ratio: 1; border-radius: 3px; background: var(--grid); min-height: 12px; }
.heat .cell:hover { outline: 2px solid var(--ink); outline-offset: -1px; }
.legend-seq { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.legend-seq i { display: inline-block; width: 16px; height: 8px; border-radius: 2px; }

/* block */
.blk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 12px; }
.blk .kpi { min-height: 0; }
.track { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.track .fill { height: 100%; background: var(--accent); }
.status { font-size: 12px; color: var(--muted); }
.status.err { color: var(--bad); }
footer { color: var(--muted); font-size: 11.5px; margin-top: 16px; line-height: 1.7; }
footer code { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="8" width="3.2" height="7" rx="1" fill="#fff"/><rect x="6.4" y="4" width="3.2" height="11" rx="1" fill="#fff"/><rect x="11.8" y="1" width="3.2" height="14" rx="1" fill="#fff"/></svg></div>
    <div>
      <h1>Claude Code 用量监控</h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
  </div>
  <div class="right">
    <div class="live"><span class="dot" id="dot"></span><span id="live">—</span></div>
    <div class="chips" id="range" role="group" aria-label="时间范围">
      <button data-days="1">1D</button>
      <button data-days="7" aria-pressed="true">7D</button>
      <button data-days="30">30D</button>
      <button data-days="90">90D</button>
      <button data-days="0">ALL</button>
    </div>
    <button class="btn" id="theme" title="切换深浅色">◐</button>
    <button class="btn" id="reload" title="重新拉取数据">↻</button>
  </div>
</div>

<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="panel c8">
    <div class="ph"><h2>每日费用 · 按模型</h2><span class="hint" id="h-daily"></span></div>
    <div class="plot" style="height:372px"><canvas id="c-daily-model"></canvas></div>
  </div>
  <div class="panel c4">
    <div class="ph"><h2>项目费用排行 &amp; 请求数</h2><span class="hint" id="h-rank"></span></div>
    <div class="plot tall" style="height:372px"><canvas id="c-project-rank"></canvas></div>
  </div>

  <div class="panel c8">
    <div class="ph"><h2>各项目每日费用</h2><span class="hint">按累计费用取前 7 项，其余归入「其他」；颜色固定跟随项目</span></div>
    <div class="plot" style="height:300px"><canvas id="c-daily-project"></canvas></div>
  </div>
  <div class="panel c4">
    <div class="ph"><h2>计费窗口历史</h2><span class="hint" id="h-blocks"></span></div>
    <div class="plot" style="height:300px"><canvas id="c-blocks"></canvas></div>
  </div>

  <div class="panel c6">
    <div class="ph"><h2>每日活跃度</h2><span class="hint">会话数 = 当日有请求的会话；请求数 = assistant 回复条数</span></div>
    <div class="sub-h">会话数</div>
    <div class="plot mini"><canvas id="c-sessions"></canvas></div>
    <div class="sub-h">请求数</div>
    <div class="plot mini"><canvas id="c-msgs"></canvas></div>
  </div>
  <div class="panel c6">
    <div class="ph"><h2>活跃时段热力图</h2><span class="hint">星期 × 小时 · 本机时区 · 全部历史</span></div>
    <div class="heatwrap"><div class="heat" id="heat"></div></div>
    <div class="legend-seq" id="heat-legend"></div>
  </div>
  <div class="panel">
    <div class="ph"><h2>当前 5 小时计费窗口</h2><span class="hint">ccusage blocks · 对照 Max/Pro 套餐额度</span></div>
    <div id="block"></div>
  </div>

  <div class="panel">
    <div class="ph"><h2>项目明细</h2><span class="hint" id="h-proj"></span></div>
    <div class="tw"><table id="t-projects"></table></div>
  </div>
  <div class="panel">
    <div class="ph"><h2>最近会话</h2><span class="hint">最近 30 个会话</span></div>
    <div class="tw"><table id="t-sessions"></table></div>
  </div>
</section>

<footer id="foot"></footer>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const state = { days: 7, data: null, charts: {}, timer: null, loadedAt: 0, error: null };
const REFRESH_MS = 2 * 60 * 1000;
const SLOTS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
// 项目显示名别名：key = 项目 id，只影响页面展示
const PROJECT_ALIAS = { '-home-jack-workspace-github-english-lessons': 'ai-practice' };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const money = (v, d = 2) => '$' + (v ?? 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const int = (v) => (v ?? 0).toLocaleString('en-US');
const tok = (v) => { v = v || 0; if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B'; if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M'; if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K'; return String(v); };
const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? '-' : `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const rel = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; if (isNaN(s)) return '-'; if (s < 60) return '刚刚'; if (s < 3600) return `${Math.floor(s / 60)} 分钟前`; if (s < 86400) return `${Math.floor(s / 3600)} 小时前`; if (s < 86400 * 30) return `${Math.floor(s / 86400)} 天前`; return ymd(new Date(iso)); };
const shortModel = (m) => m.replace(/^claude-/, '').replace(/-\d{8}$/, '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a) => a.reduce((s, v) => s + (v || 0), 0);

// ---------- theme ----------
function applyTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('cc2-theme', t); } catch {} }
(() => { let t = null; try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('cc2-theme'); } catch {} applyTheme(t === 'dark' ? 'dark' : 'light'); })();
$('#theme').onclick = () => { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); render(); };

// ---------- range ----------
try { const d = localStorage.getItem('cc2-days'); if (d !== null && d !== '') state.days = +d; } catch {}
for (const b of document.querySelectorAll('#range button')) {
  b.setAttribute('aria-pressed', String(+b.dataset.days === state.days));
  b.onclick = () => { state.days = +b.dataset.days; try { localStorage.setItem('cc2-days', state.days); } catch {} for (const x of document.querySelectorAll('#range button')) x.setAttribute('aria-pressed', String(x === b)); render(); };
}
$('#reload').onclick = () => load();

// ---------- load ----------
async function getJSON(name) { const r = await fetch(`data/${name}.json?t=${Date.now()}`, { cache: 'no-store' }); if (!r.ok) throw new Error(`${name}.json HTTP ${r.status}`); return r.json(); }
async function load() {
  try {
    const [projects, meta, blocks, daily] = await Promise.all([getJSON('projects'), getJSON('meta'), getJSON('blocks').catch(() => null), getJSON('daily').catch(() => null)]);
    state.data = { projects, meta, blocks, daily }; state.loadedAt = Date.now(); state.error = null;
    render();
  } catch (e) { state.error = e.message; console.error(e); tickLive(); }
  clearTimeout(state.timer); state.timer = setTimeout(load, REFRESH_MS);
}
function tickLive() {
  const dot = $('#dot'), live = $('#live');
  if (state.error) { dot.className = 'dot err'; live.textContent = '加载失败: ' + state.error; return; }
  if (!state.data) return;
  const gen = new Date(state.data.projects.generatedAt);
  const ageMin = Math.floor((Date.now() - gen) / 60000);
  const left = Math.max(0, Math.ceil((state.loadedAt + REFRESH_MS - Date.now()) / 1000));
  dot.className = 'dot' + (ageMin > 30 ? ' stale' : '');
  live.innerHTML = `数据 <span class="mono">${ageMin} 分钟前</span> · 下次刷新 <span class="mono">${pad(Math.floor(left / 60))}:${pad(left % 60)}</span>`;
}
setInterval(tickLive, 1000);

// ---------- helpers ----------
function dateList(days, firstDate, endOffset = 0) {
  const end = new Date(); end.setHours(0, 0, 0, 0); end.setDate(end.getDate() - endOffset);
  let start;
  if (days > 0) { start = new Date(end); start.setDate(start.getDate() - days + 1); }
  else { start = firstDate ? new Date(firstDate + 'T00:00:00') : new Date(end); }
  const out = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) out.push(ymd(d));
  return out;
}
function spark(values, color, w = 84, h = 30, cls = 'spark') {
  const max = Math.max(...values, 1e-9); const n = values.length; const bw = Math.max(1, (w - (n - 1) * 1.5) / n);
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">` + values.map((v, i) => { const bh = Math.max(v > 0 ? 1.5 : 0, v / max * h); return `<rect x="${(i * (bw + 1.5)).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${color}" opacity="${i === n - 1 ? 1 : 0.55}"/>`; }).join('') + '</svg>';
}
const tspark = (values, color) => spark(values, color, 96, 20, 'tspark');
const dur = (s) => s >= 3600 ? `${Math.floor(s / 3600)}h${pad(Math.round(s % 3600 / 60))}m` : s >= 60 ? `${Math.floor(s / 60)}m${pad(s % 60)}s` : `${s}s`;
function delta(cur, prev) { if (!(prev > 0)) return `<span class="pill flat">—</span>`; const r = (cur - prev) / prev; if (Math.abs(r) < 0.005) return `<span class="pill flat">0%</span>`; return `<span class="pill ${r > 0 ? 'up' : 'down'}">${r > 0 ? '▲' : '▼'} ${Math.abs(r * 100).toFixed(0)}%</span>`; }

function chartDefaults() {
  Chart.defaults.color = css('--muted');
  Chart.defaults.font.family = '"JetBrains Mono", ui-monospace, monospace';
  Chart.defaults.font.size = 11;
  const L = Chart.defaults.plugins.legend.labels; L.usePointStyle = true; L.pointStyle = 'rectRounded'; L.boxWidth = 8; L.boxHeight = 8; L.color = css('--ink-2'); L.font = { family: 'Inter, system-ui, sans-serif', size: 11.5 };
  const T = Chart.defaults.plugins.tooltip; T.backgroundColor = css('--tip-bg'); T.titleColor = css('--tip-ink'); T.bodyColor = css('--tip-ink'); T.footerColor = css('--tip-ink'); T.padding = 10; T.boxPadding = 4; T.usePointStyle = true; T.cornerRadius = 6; T.titleFont = { family: '"JetBrains Mono", monospace', size: 11 }; T.bodyFont = { family: 'Inter, system-ui, sans-serif', size: 12 }; T.footerFont = { family: '"JetBrains Mono", monospace', size: 11, weight: '600' };
  Chart.defaults.animation = false;
}
function mk(id, cfg) { if (state.charts[id]) state.charts[id].destroy(); state.charts[id] = new Chart($('#' + id), cfg); }
const gridOpts = () => ({ color: css('--grid'), drawTicks: false });
const xDate = (dates) => ({ stacked: true, grid: { display: false }, border: { color: css('--axis') }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: dates.length > 40 ? 10 : 15, callback: (v, i) => dates[i]?.slice(5) } });
const yNum = (fmt) => ({ stacked: true, beginAtZero: true, grid: gridOpts(), border: { display: false }, ticks: { callback: fmt, padding: 6, maxTicksLimit: 6 } });
function stackedTooltip(fmt, extra) {
  return { mode: 'index', intersect: false, filter: (i) => i.raw !== 0 && i.raw != null && !i.dataset.tipHide,
    itemSort: (a, b) => (a.dataset.type === 'line') - (b.dataset.type === 'line') || b.raw - a.raw,

  const maxCost = rows[0] ? projCostInRange[rows[0].id] : 1;
  $('#t-projects').innerHTML = `<thead><tr><th></th><th>项目</th><th class="num">费用</th><th>占比</th><th>近 14 天</th><th class="num">Tokens</th><th class="num">请求</th><th class="num">会话</th><th class="num">$/会话</th><th>主模型</th><th>最近活动</th></tr></thead><tbody>` +
    rows.map((p, i) => { const c = projCostInRange[p.id]; const topModel = Object.entries(p.models).sort((a, b) => b[1] - a[1])[0]?.[0]; return `<tr><td class="rank num">${i + 1}</td><td class="name" title="${esc(p.cwd || p.id)}"><span class="sw" style="background:${projColor(p.id)}"></span>${esc(p.name)}</td><td class="num">${money(c)}</td><td><span class="share"><span class="track"><span class="fill" style="width:${(c / maxCost * 100).toFixed(1)}%;background:${projColor(p.id)}"></span></span><span class="num dim">${pct(c / rangeTotal)}</span></span></td><td>${tspark(projSpark[p.id] || last14dates.map(() => 0), projColor(p.id))}</td><td class="num">${tok(projTokInRange[p.id])}</td><td class="num">${int(projMsgInRange[p.id])}</td><td class="num">${int(p.sessions)}</td><td class="num dim">${money(p.cost / (p.sessions || 1), 0)}</td><td>${topModel ? `<span class="badge">${shortModel(topModel)}</span>` : '-'}</td><td class="dim" title="${fmtTime(p.last)}">${rel(p.last)}</td></tr>`; }).join('') +
    `</tbody><tfoot><tr><th></th><th>${rows.length} 个项目</th><th class="num">${money(rangeTotal)}</th><th></th><th></th><th class="num">${tok(sum(Object.values(projTokInRange)))}</th><th class="num">${int(sum(Object.values(projMsgInRange)))}</th><th class="num">${int(sum(rows.map((p) => p.sessions)))}</th><th></th><th></th><th></th></tr></tfoot>`;

  // ---- sessions table
  $('#t-sessions').innerHTML = `<thead><tr><th>最近活动</th><th>项目</th><th>会话</th><th class="num">时长</th><th class="num">请求</th><th class="num">Tokens</th><th class="num">费用</th><th class="num">$/次</th><th>模型</th></tr></thead><tbody>` +
    P.sessions.slice(0, 30).map((s) => { const mins = Math.max(0, Math.round((new Date(s.last) - new Date(s.first)) / 60000)); const dur = mins >= 60 ? `${Math.floor(mins / 60)}h${pad(mins % 60)}m` : `${mins}m`; return `<tr><td class="dim" title="${fmtTime(s.last)}">${rel(s.last)}</td><td class="name"><span class="sw" style="background:${projColor(s.project)}"></span>${esc(s.projectName)}</td><td class="mono dim">${s.id.slice(0, 8)}</td><td class="num">${dur}</td><td class="num">${int(s.msgs)}</td><td class="num">${tok(s.tokens)}</td><td class="num">${money(s.cost)}</td><td class="num dim">${money(s.cost / (s.msgs || 1))}</td><td>${s.models.map((m) => `<span class="badge">${shortModel(m)}</span>`).join(' ')}</td></tr>`; }).join('') + '</tbody>';

  // ---- footer
  const ccTotal = ccDaily?.totals?.totalCost;
  const ccAgents = [...new Set((ccDaily?.daily || []).flatMap((d) => d.metadata?.agents || []))];
  const others = ccAgents.filter((a) => a !== 'claude');
  $('#foot').innerHTML = `
    <div>数据来源：<code>bin/aggregate.mjs</code> 扫描 <code>~/.claude/projects/**/*.jsonl</code>，按 项目 × 日期 × 模型 聚合；定价取 LiteLLM 公开价格表（${P.pricingFetchedAt ? '更新于 ' + fmtTime(P.pricingFetchedAt) : '缓存'}），5 分钟 / 1 小时缓存写入分别计价。计费窗口来自 ccusage ${esc(meta.ccusageVersion || '')}。</div>
    <div>对账：ccusage 累计 ${ccTotal != null ? money(ccTotal, 0) : '-'}（含 ${ccAgents.join(' + ') || '-'}），本页 Claude Code 累计 ${money(P.totals.cost, 0)}${ccTotal != null ? `，差额 ${money(ccTotal - P.totals.cost, 0)}${others.length ? ` 为 ${others.join(' / ')} 的用量` : ''}` : ''}。${P.unknownModels?.length ? `<span class="status err">未找到定价的模型：${P.unknownModels.join(', ')}</span>` : ''}</div>
    <div>刷新：cron 每 5 分钟执行 <code>bin/refresh.sh</code>（上次耗时 ${meta.durationSec ?? '-'} 秒，${meta.ok ? '正常' : '<span class="status err">有错误，见 logs/refresh.log</span>'}），页面每 2 分钟自动重新拉取。费用为按公开 API 价格的估算，订阅套餐不按此付费。</div>`;
}

load();
})();
</script>
</body>
</html>
